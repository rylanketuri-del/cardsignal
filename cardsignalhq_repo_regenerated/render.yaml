# NOTE: No persistent disk is declared. Web and cron filesystems are ephemeral and
# not shared. NFL activation must use durable storage (Supabase performance_snapshots
# + weekly tables) via ADMIN_API_TOKEN-protected import/weekly endpoints. Do not rely
# on Render Shell writes to ./output/nfl/import without attaching a disk and setting
# OUTPUT_DIR to that mount on BOTH services.
services:
  - type: web
    name: cardchase-ai-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: NFL_SEASON
        value: 2025
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIPELINE_TRIGGER_TOKEN
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: OUTPUT_DIR
        sync: false

  - type: cron
    name: cardchase-ai-pipeline-cron
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 */3 * * *"
    startCommand: python scripts/run_pipeline.py
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: NFL_SEASON
        value: 2025
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: OUTPUT_DIR
        sync: false
