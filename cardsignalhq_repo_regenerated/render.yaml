services:
  - type: web
    name: cardchase-ai-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIPELINE_TRIGGER_TOKEN
        sync: false

  # ---------------------------------------------------------------------------
  # Scheduling notes (Render cron is UTC-only; America/New_York observes DST):
  #   EDT (UTC-4, ~Mar–Nov): 10:00 UTC == 06:00 Eastern
  #   EST (UTC-5, ~Nov–Mar): 10:00 UTC == 05:00 Eastern
  # Beta intentionally anchors to 06:00 Eastern Daylight Time (10:00 UTC).
  # During EST the weekly job runs one hour earlier local time (05:00).
  # There is no second production scheduler (no GitHub Actions cron).
  # ---------------------------------------------------------------------------

  # MLB leaderboard refresh: every 3 days at 10:00 UTC.
  # Entry point: python scripts/run_pipeline.py  (→ pipelines.mlb_pipeline / run_pipeline)
  - type: cron
    name: cardchase-ai-mlb-pipeline-cron
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 10 */3 * *"
    startCommand: python scripts/run_pipeline.py
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # NFL + NBA weekly intelligence: Tuesdays at 10:00 UTC (~06:00 Eastern Daylight).
  # Entry point: python scripts/run_weekly_pipelines.py
  #   → pipelines.weekly_pipeline.run_weekly_pipeline (NFL, then NBA)
  # Idempotent — skips when an official weekly snapshot already exists.
  - type: cron
    name: cardchase-ai-weekly-pipeline-cron
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 10 * * 2"
    startCommand: python scripts/run_weekly_pipelines.py
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: NFL_SEASON
        value: 2025
      - key: NBA_SEASON
        value: 2025
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
