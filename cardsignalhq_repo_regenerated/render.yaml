services:
  - type: web
    name: cardchase-ai-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIPELINE_TRIGGER_TOKEN
        sync: false

  # MLB leaderboard: every 3 days at 10:00 UTC (~06:00 Eastern).
  # The pipeline also runs the shared weekly due-check for NFL/NBA.
  - type: cron
    name: cardchase-ai-mlb-pipeline-cron
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 10 */3 * *"
    startCommand: python scripts/run_pipeline.py
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # NFL + NBA weekly intelligence: every Tuesday 10:00 UTC (~06:00 Eastern).
  # Idempotent — skips when the official weekly snapshot already exists.
  - type: cron
    name: cardchase-ai-weekly-pipeline-cron
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 10 * * 2"
    startCommand: python scripts/run_weekly_pipelines.py
    plan: free
    envVars:
      - key: EBAY_TOKEN
        sync: false
      - key: TRACKED_PLAYERS
        sync: false
      - key: MLB_SEASON
        value: 2026
      - key: NFL_SEASON
        value: 2025
      - key: NBA_SEASON
        value: 2025
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
